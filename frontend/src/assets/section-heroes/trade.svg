<path d="M53 205H509L481 257Q475 265 461 265H126Q110 265 100 253L53 205Z" fill="url(#hull)" stroke="#9DB8C8" stroke-width="2" stroke-linejoin="round"/><path d="M63 213H498M91 236h393" stroke="#B5CBD8" stroke-opacity=".45" stroke-width="1.4"/><path d="M99 252q12 13 29 13h333q15 0 22-11" stroke="#D6B47C" stroke-opacity=".85" stroke-width="2"/><path d="M102 207v-10h390v10M116 197v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6m22 6v-6" stroke="#A8C1D0" stroke-width="1.5"/>
<path d="M75 218h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14m20 0h14" stroke="#E8C68D" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
<!-- water -->
<path d="M0 258c72-10 110 14 180 4s113-10 175 0 137-9 205-3v41H0z" fill="url(#sea)"/><path d="M16 273c61-11 103 9 160 0s116-8 178 1 124-11 190-3M45 286c60-8 116 8 185-1s112-5 166 0 97-4 137-2" stroke="#82B6D1" stroke-opacity=".28" stroke-width="1.6"/><path d="M92 267c28 5 44 5 73 0m242 1c29 5 51 4 81-2" stroke="#E5F4FC" stroke-opacity=".45" stroke-width="2"/>
<path d="M510 114h25m-12-12v25" stroke="#B6D0DD" stroke-opacity=".38" stroke-width="1.5"/>
</svg>
