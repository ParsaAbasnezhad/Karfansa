
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="560" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081524"/>
      <stop offset=".55" stop-color="#142A42"/>
      <stop offset="1" stop-color="#0B192B"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#304E6B"/>
      <stop offset=".5" stop-color="#172F49"/>
      <stop offset="1" stop-color="#102237"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5D99B"/>
      <stop offset=".5" stop-color="#C9A76E"/>
      <stop offset="1" stop-color="#9B743B"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#87B9DB"/>
      <stop offset=".45" stop-color="#395B78"/>
      <stop offset="1" stop-color="#C9A76E"/>
    </linearGradient>

    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D9B675" stop-opacity=".3"/>
      <stop offset="1" stop-color="#D9B675" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop stop-color="#367DB5" stop-opacity=".23"/>
      <stop offset="1" stop-color="#367DB5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" stroke="#9AB7CE" stroke-opacity=".065"/>
    </pattern>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020912" flood-opacity=".65"/>
    </filter>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="300" fill="url(#bg)"/>
  <rect width="560" height="300" fill="url(#grid)"/>
  <ellipse cx="310" cy="130" rx="270" ry="170" fill="url(#ambient)"/>

  <!-- Architectural orbit lines -->
  <circle cx="280" cy="150" r="138" stroke="#7398B8" stroke-opacity=".08"/>
  <circle cx="280" cy="150" r="168" stroke="#7398B8" stroke-opacity=".06"/>

  <path d="M-20 268C100 184 155 320 290 252S455 205 590 245"
        stroke="#568DB5" stroke-opacity=".2"/>
  <path d="M-20 280C100 196 155 332 290 264S455 217 590 257"
        stroke="#C9A76E" stroke-opacity=".15"/>

  <!-- Main dashboard -->
  <g filter="url(#shadow)">
    <rect x="140" y="37" width="330" height="225" rx="18"
          fill="url(#glass)" stroke="url(#border)" stroke-width="1.2"/>

    <rect x="147" y="44" width="316" height="211" rx="13"
          stroke="#A7C5DC" stroke-opacity=".08"/>

    <!-- Header -->
    <path d="M140 56Q140 37 159 37H451Q470 37 470 56V78H140Z"
          fill="#A5C9E6" fill-opacity=".045"/>
    <path d="M140 78H470" stroke="#8AAAC4" stroke-opacity=".2"/>

    <circle cx="159" cy="58" r="3.5" fill="url(#gold)"/>
    <circle cx="172" cy="58" r="3.5" fill="#7899B5"/>
    <circle cx="185" cy="58" r="3.5" fill="#7899B5" fill-opacity=".5"/>

    <!-- Search -->
    <rect x="314" y="49" width="104" height="19" rx="9.5"
          fill="#091C30" stroke="#7195B5" stroke-opacity=".4"/>
    <circle cx="326" cy="58" r="3.5" stroke="#9CB8CD"/>
    <path d="m329 61 3 3" stroke="#9CB8CD" stroke-linecap="round"/>
    <rect x="338" y="56" width="43" height="3" rx="1.5" fill="#7391AC"/>

    <circle cx="442" cy="58" r="10" fill="#35536D"/>
    <circle cx="442" cy="55" r="3" stroke="#C4D6E5"/>
    <path d="M436 64Q442 57 448 64" stroke="#C4D6E5" stroke-linecap="round"/>

    <!-- Sidebar -->
    <rect x="158" y="92" width="105" height="151" rx="10"
          fill="#0C2034" stroke="#6284A2" stroke-opacity=".35"/>

    <rect x="171" y="106" width="47" height="5" rx="2.5" fill="#D9E6F0"/>
    <rect x="171" y="118" width="68" height="3" rx="1.5" fill="#64839E"/>

    <rect x="169" y="135" width="83" height="24" rx="6"
          fill="#304C67" stroke="#C9A76E" stroke-opacity=".4"/>
    <rect x="169" y="141" width="2" height="12" rx="1" fill="url(#gold)"/>
    <circle cx="182" cy="147" r="3.5" fill="url(#gold)"/>
    <rect x="193" y="145" width="42" height="4" rx="2" fill="#D5E1EA"/>

    <rect x="169" y="168" width="83" height="24" rx="6" fill="#203A53"/>
    <circle cx="182" cy="180" r="3.5" fill="#77B1D0"/>
    <rect x="193" y="178" width="34" height="4" rx="2" fill="#9FB7CB"/>

    <rect x="169" y="201" width="83" height="24" rx="6" fill="#203A53"/>
    <circle cx="182" cy="213" r="3.5" fill="#7D9AB4"/>
    <rect x="193" y="211" width="44" height="4" rx="2" fill="#9FB7CB"/>

    <!-- Analytics card -->
    <rect x="276" y="92" width="176" height="105" rx="10"
          fill="#0C2034" stroke="#7499B9" stroke-opacity=".4"/>

    <rect x="290" y="105" width="60" height="5" rx="2.5" fill="#DDE8F0"/>
    <rect x="290" y="116" width="32" height="3" rx="1.5" fill="#6989A3"/>

    <!-- Chart indicator -->
    <rect x="414" y="103" width="24" height="20" rx="5" fill="#28445D"/>
    <path d="M420 117V113M426 117V110M432 117V106"
          stroke="#D9B675" stroke-width="2" stroke-linecap="round"/>

    <!-- Chart grid -->
    <path d="M290 136H438M290 151H438M290 166H438M290 181H438"
          stroke="#789BB7" stroke-opacity=".13" stroke-dasharray="3 4"/>

    <!-- Chart area -->
    <path d="M290 177L311 164L333 170L355 146L377 154L399 137L420 143L438 126V185H290Z"
          fill="url(#chartFill)"/>

    <path d="M290 177L311 164L333 170L355 146L377 154L399 137L420 143L438 126"
          stroke="#E7C588" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <circle cx="355" cy="146" r="3" fill="#F4D59A" stroke="#142A42"/>
    <circle cx="399" cy="137" r="3" fill="#F4D59A" stroke="#142A42"/>
    <circle cx="438" cy="126" r="3.5" fill="#F4D59A" filter="url(#glow)"/>

    <!-- Status card -->
    <rect x="276" y="208" width="176" height="35" rx="8"
          fill="#243F58" stroke="#7FA2BF" stroke-opacity=".25"/>

    <circle cx="294" cy="225.5" r="9" fill="url(#gold)"/>
    <path d="m290 225 3 3 5-6" stroke="#102237" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="310" y="219" width="66" height="4" rx="2" fill="#E0EAF2"/>
    <rect x="310" y="229" width="42" height="3" rx="1.5" fill="#89A4BA"/>

    <!-- Mini histogram -->
    <g fill="#83B2D2">
      <rect x="398" y="231" width="4" height="5" rx="1"/>
      <rect x="405" y="227" width="4" height="9" rx="1"/>
      <rect x="412" y="229" width="4" height="7" rx="1"/>
      <rect x="419" y="221" width="4" height="15" rx="1"/>
      <rect x="426" y="217" width="4" height="19" rx="1"/>
      <rect x="433" y="213" width="4" height="23" rx="1" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Floating business card -->
  <g filter="url(#shadow)">
    <rect x="39" y="101" width="116" height="116" rx="21"
          fill="url(#glass)" stroke="url(#border)" stroke-width="1.3"/>

    <rect x="45" y="107" width="104" height="104" rx="16"
          stroke="#B2D0E5" stroke-opacity=".12"/>

    <!-- Briefcase -->
    <rect x="63" y="137" width="68" height="49" rx="9"
          fill="#132B42" stroke="#D4E5F1" stroke-width="2.2"/>

    <path d="M84 137V128Q84 122 90 122H104Q110 122 110 128V137"
          stroke="#D4E5F1" stroke-width="2.2" stroke-linecap="round"/>

    <path d="M63 152Q97 173 131 152"
          stroke="#D4E5F1" stroke-width="2"/>

    <rect x="90" y="157" width="14" height="10" rx="2.5" fill="url(#gold)"/>

    <path d="M59 112H89" stroke="#A5D3F0" stroke-opacity=".6"
          stroke-linecap="round"/>
  </g>

  <!-- Verification badge -->
  <path d="M470 151H508V130" stroke="#C9A76E"
        stroke-opacity=".65" stroke-dasharray="3 5"/>

  <circle cx="508" cy="112" r="27" stroke="#C9A76E" stroke-opacity=".1"/>
  <circle cx="508" cy="112" r="21" stroke="#C9A76E" stroke-opacity=".25"/>
  <circle cx="508" cy="112" r="15" fill="url(#gold)"/>

  <path d="m501 112 5 5 9-10"
        stroke="#14243A" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accents -->
  <circle cx="67" cy="65" r="2.5" fill="#D9B675" filter="url(#glow)"/>
  <path d="M77 65H125" stroke="#C9A76E" stroke-opacity=".4"/>
  <circle cx="490" cy="239" r="2" fill="#83B2D2"/>
  <path d="M490 249V269H520" stroke="#83B2D2" stroke-opacity=".25"/>
</svg>
