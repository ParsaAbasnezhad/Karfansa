[project]
name = "karfansa-backend"
version = "0.1.0"
description = "Karfansa backend: Django + Django Ninja modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "pydantic>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.5,<6",
    "redis>=5,<7",
    "django-environ>=0.12,<1",
    "gunicorn>=23,<24",
    "argon2-cffi>=23,<26",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1,<6",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
